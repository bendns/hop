name: Hop
options:
  bundleIdPrefix: com.bendns.hopapp
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
targets:
  Hop:
    type: application
    platform: macOS
    sources:
      - path: Hop
    info:
      path: Hop/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Hop!
        NSHumanReadableCopyright: ""
    entitlements:
      path: Hop/Hop.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bendns.hopapp
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HopTests
    dependencies:
      - target: Hop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bendns.hopapp.tests
