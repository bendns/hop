name: Hop
options:
  bundleIdPrefix: com.bendns.hopapp
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
targets:
  Hop:
    type: application
    platform: macOS
    sources:
      - path: Hop
    info:
      path: Hop/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Hop!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: ""
    entitlements:
      path: Hop/Hop.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # CSV export through NSSavePanel.
        com.apple.security.files.user-selected.read-write: true
        # Read-only access to data written by pre-sandbox versions, copied into
        # the container once by LegacyDataMigration.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/Hop/
          - /Library/Preferences/com.bendns.hopapp.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bendns.hopapp
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          # Ad-hoc signing otherwise adds get-task-allow, letting any local
          # process attach a debugger despite the hardened runtime.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  HopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HopTests
    dependencies:
      - target: Hop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bendns.hopapp.tests
