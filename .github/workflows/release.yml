name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

# Each job asks for what it needs; nothing by default.
permissions: {}

jobs:
  build:
    name: Build and attest
    runs-on: macos-26
    timeout-minutes: 25
    # Read-only on the repo: the third-party tooling below never sees a write token.
    permissions:
      contents: read
      id-token: write      # sign the provenance attestation
      attestations: write
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      zip: ${{ steps.pkg.outputs.zip }}
      sha256: ${{ steps.pkg.outputs.sha256 }}
    steps:
      - name: Resolve and validate version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Build the tagged commit, also for manual runs started from a branch.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.ver.outputs.tag }}
          persist-credentials: false

      - name: Install XcodeGen
        run: scripts/install-xcodegen.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          xcodebuild \
            -project Hop.xcodeproj \
            -scheme Hop \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package zip
        id: pkg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          APP_PATH="build/Build/Products/Release/Hop.app"
          test -d "$APP_PATH" || (echo "App not found at $APP_PATH"; find build -name 'Hop.app' -print; exit 1)
          # Fail the release if the debugger entitlement ever comes back.
          if codesign -d --entitlements - --xml "$APP_PATH" 2>/dev/null | grep -q get-task-allow; then
            echo "::error::Release build carries get-task-allow"
            exit 1
          fi
          ZIP_NAME="Hop-$VERSION.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_NAME"
          SHA256=$(shasum -a 256 "$ZIP_NAME" | awk '{print $1}')
          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Built $ZIP_NAME (SHA256: $SHA256)"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pkg.outputs.zip }}

      - name: Upload zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-zip
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with write access; it runs no third-party tooling.
    permissions:
      contents: write
    steps:
      - name: Download zip
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          ZIP: ${{ needs.build.outputs.zip }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          echo "$SHA256  $ZIP" | sha256sum -c -
          NOTES_FILE=$(mktemp)
          cat > "$NOTES_FILE" <<EOF
          ## Hop $VERSION

          Ad-hoc signed macOS menu bar app.

          ### Install via Homebrew

          \`\`\`
          brew install --cask bendns/hop/hop-app
          \`\`\`

          On first launch, macOS may block the app because it's ad-hoc signed. Right-click \`/Applications/Hop.app\` → Open → Open.

          ### Verify the download

          This zip was built by GitHub Actions from tag \`$TAG\`. Check its build provenance with the GitHub CLI:

          \`\`\`
          gh attestation verify $ZIP -R $REPO
          \`\`\`

          SHA256:

          \`\`\`
          $SHA256  $ZIP
          \`\`\`
          EOF
          gh release create "$TAG" \
            --repo "$REPO" \
            --verify-tag \
            --title "Hop $VERSION" \
            --notes-file "$NOTES_FILE" \
            "$ZIP"

      - name: Cask snippet
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          cat <<EOF

          ========================================================
          Update Casks/hop-app.rb in bendns/homebrew-hop with:

              version "$VERSION"
              sha256 "$SHA256"

          URL pattern already uses "#{version}" so no change needed.
          ========================================================
          EOF
