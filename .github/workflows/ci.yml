name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: scripts/install-xcodegen.sh

      - name: Generate Xcode project
        run: |
          xcodegen --version
          xcodegen generate

      # `test` builds the app first, so no separate build step.
      - name: Build and test
        run: |
          xcodebuild \
            -project Hop.xcodeproj \
            -scheme Hop \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            test
